<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leonida Legend — GTA VI Trophy Guide &amp; Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="site-header">
  <div class="brand">
    <h1>Leonida Legend</h1>
    <p class="tagline">Grand Theft Auto VI · PlayStation 5 trophy guide &amp; tracker · all 55 trophies · runs fully offline</p>
  </div>
  <div class="progress-box" aria-label="Your progress">
    <div class="progress-line"><strong id="progress-count">0 of 55 earned</strong><span id="progress-pct">0%</span></div>
    <div class="progress-bar"><div id="progress-fill"></div></div>
    <div class="grade-counts" id="grade-counts"></div>
  </div>
</header>

<nav class="view-tabs" id="view-tabs" aria-label="Views">
  <button type="button" data-view="tracker" class="tab active">Tracker</button>
  <button type="button" data-view="roadmap" class="tab">Roadmap to Platinum</button>
  <button type="button" data-view="missables" class="tab">Missables</button>
</nav>

<section class="controls" id="controls" aria-label="Filters and progress tools">
  <div class="chips" id="kind-chips" role="group" aria-label="Filter by kind">
    <button type="button" data-kind="all" class="chip active">All</button>
    <button type="button" data-kind="story" class="chip">Story</button>
    <button type="button" data-kind="missable" class="chip">Missable</button>
    <button type="button" data-kind="collectibles" class="chip">Collectibles</button>
    <button type="button" data-kind="activities" class="chip">Activities</button>
    <button type="button" data-kind="online" class="chip">Online</button>
  </div>
  <label class="control">Grade
    <select id="grade-filter">
      <option value="all">All grades</option>
      <option value="platinum">Platinum</option>
      <option value="gold">Gold</option>
      <option value="silver">Silver</option>
      <option value="bronze">Bronze</option>
    </select>
  </label>
  <label class="control grow">Search
    <input id="search" type="search" placeholder="Search name or description" autocomplete="off">
  </label>
  <label class="control toggle"><input type="checkbox" id="spoiler-safe"> Spoiler-safe</label>
  <button type="button" id="export-btn" class="tool-btn">Export progress</button>
  <label class="tool-btn file-btn">Import progress<input type="file" id="import-file" accept="application/json,.json" hidden></label>
</section>

<main class="layout">
  <section id="list-pane" aria-label="Trophies"></section>
  <aside id="detail-pane" aria-label="Trophy guide"></aside>
</main>

<footer class="site-footer">
  <p>Guides are written in our own words from the sources cited on each trophy. Progress is stored only in this browser.</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
